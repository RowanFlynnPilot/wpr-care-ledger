name: deploy

on:
  push:
    branches: [main]
  workflow_run:
    workflows: [fetch, wayback]  # wayback: its copies show in the widget
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Queue rather than cancel: a Pages deploy cut off midway can leave the site
# half-published. Each deploy builds the latest main, so the queued one
# catches up.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: widget/package-lock.json
      - run: npm ci
        working-directory: widget
      - run: npm run build   # prebuild syncs data/ and archive/ into the bundle
        working-directory: widget
      # What a reader does, against the very build about to go live: load,
      # search, story links, map, embed, phone width, facility pages, feeds.
      # A failure stops here, and the live site keeps the last good build.
      - run: npx playwright install --with-deps chromium
        working-directory: widget
      - run: npm test
        working-directory: widget
      # Replay a failure with: npx playwright show-trace <trace.zip>
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces
          path: widget/test-results/
          retention-days: 14
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: widget/dist
      - id: deployment
        uses: actions/deploy-pages@v5
