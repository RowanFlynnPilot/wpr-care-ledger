name: deploy

on:
  push:
    branches: [main]
  workflow_run:
    workflows: [fetch, wayback]  # wayback: its copies show in the widget
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Queue rather than cancel: a Pages deploy cut off midway can leave the site
# half-published. Each deploy builds the latest main, so the queued one
# catches up.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.first_try.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: widget/package-lock.json
      # postbuild draws each facility's share card with Pillow (facility-cards.py).
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install Pillow==12.2.0
      - run: npm ci
        working-directory: widget
      - run: npm run build   # prebuild syncs data/ and archive/ into the bundle
        working-directory: widget
      # What a reader does, against the very build about to go live: load,
      # search, story links, map, embed, phone width, facility pages, feeds.
      # A failure stops here, and the live site keeps the last good build.
      - run: npx playwright install --with-deps chromium
        working-directory: widget
      - run: npm test
        working-directory: widget
      # Replay a failure with: npx playwright show-trace <trace.zip>
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces
          path: widget/test-results/
          retention-days: 14
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: widget/dist
      # GitHub's Pages service can stall in "syncing_files" until the action's
      # 10-minute ceiling (Nov. 6-7, 2026, across many repositories; the
      # build and tests here were green each time). One retry publishes the
      # same tested artifact. Never "Re-run failed jobs" by hand instead: it
      # uploads a second github-pages artifact and the deploy refuses both.
      - id: first_try
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - if: steps.first_try.outcome == 'failure'
        run: sleep 90  # let the stalled deployment clear before asking again
      - id: deployment
        if: steps.first_try.outcome == 'failure'
        uses: actions/deploy-pages@v5
