name: wayback

# Independent copies of the state's records at the Internet Archive
# (pipeline/seed_wayback.py): after each successful fetch, the Wayback
# Machine captures every new document and every facility page whose
# contents changed, straight from the state's server. Its own workflow so
# the deploy never waits on archive.org; right after the fetch because a
# facility page can only be captured while that week's detail keys are
# current (the script checks, and leaves pages for the next fetch if not).
#
# Needs two repository secrets holding an archive.org account's S3 keys
# (https://archive.org/account/s3.php): IA_ACCESS_KEY and IA_SECRET_KEY.
# The first run copies everything, ~1,100 captures at Save Page Now's 7 a
# minute: about three hours. Later weeks take minutes.

on:
  workflow_run:
    workflows: [fetch]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wayback
  cancel-in-progress: false

jobs:
  copy:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -r pipeline/requirements.txt
      - name: Copy to the Internet Archive
        timeout-minutes: 280
        env:
          IA_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
          IA_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
        run: python pipeline/seed_wayback.py
      # Commit what was copied even when the run failed partway: every
      # recorded copy is real, and the next run picks up the rest.
      - name: Commit Internet Archive records
        if: ${{ !cancelled() }}
        run: |
          git config user.name "care-ledger-bot"
          git config user.email "actions@github.com"
          git add data/wayback.json
          git diff --cached --quiet || git commit -m "Internet Archive copies $(date -u +%F)"
          git pull --rebase
          git push
