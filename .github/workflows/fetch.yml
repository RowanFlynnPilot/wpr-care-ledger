name: fetch

on:
  schedule:
    - cron: "0 9 * * 1"  # Mondays 09:00 UTC — DQA updates Sundays
  workflow_dispatch:

permissions:
  contents: write
  issues: write

# One fetch at a time; an overlapping manual run waits rather than racing
# the push.
concurrency:
  group: fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -r pipeline/requirements.txt
      - run: python -m unittest discover -s pipeline/tests   # guards first, data second
      - run: python pipeline/fetch.py
      # The archive is the product: commit it before any derived step can
      # fail, so a parser problem never costs a week of records.
      - name: Commit ledger and archive
        run: |
          git config user.name "care-ledger-bot"
          git config user.email "actions@github.com"
          git add data/facilities.json data/surveys.json archive
          git diff --cached --quiet || git commit -m "Weekly ledger update $(date -u +%F)"
          git pull --rebase
          git push
      - run: python pipeline/enrich.py
      - run: python pipeline/digest.py   # weekly tip sheet on the run's summary page
      - name: Commit mined document facts
        run: |
          git add data/enrichment.json
          git diff --cached --quiet || git commit -m "Mine new documents $(date -u +%F)"
          git pull --rebase
          git push
      # Newsroom alert: one issue listing enforcement actions new this run,
      # @mentioning the ALERT_MENTIONS repository variable; GitHub emails
      # everyone it notifies. continue-on-error: the deploy only follows a
      # successful run, and a notification hiccup must never keep new records
      # off the site (the tip sheet still lists them).
      - name: Alert on new enforcement actions
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ALERT_MENTIONS: ${{ vars.ALERT_MENTIONS }}
        run: python pipeline/digest.py --alert
      # Fail loud: a red run nobody opens isn't loud. One open issue, not one
      # per week. Expected to fire when the state launches the Wisconsin
      # Provider Finder and retires DQA Provider Search (see CLAUDE.md).
      - name: Open issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create fetch-failure --color B60205 \
            --description "Weekly DQA fetch failed" --force
          if [ -z "$(gh issue list --label fetch-failure --state open --json number --jq '.[0].number')" ]; then
            gh issue create --title "Weekly fetch failed — $(date -u +%F)" \
              --label fetch-failure \
              --body "The scheduled DQA fetch failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          If the failure is in fetch.py, nothing was committed; if it is in enrich.py, the week's records and documents were committed first and only the mined facts are behind. Either way the live widget keeps the last deployed data and tells readers when it goes stale. The run log's final RuntimeError names the cause: a portal error page, a detail page failing its identity check, a changed export, grid or survey table, survey records inside the state's three-year window vanishing, or ledger documents that don't join to the archive (see CLAUDE.md, data contract).

          If the state's DQA Provider Search has been replaced by the Wisconsin Provider Finder, this is the migration event described in CLAUDE.md — rewrite the fetcher against the new tool; the ledger and archive carry forward untouched."
          fi
